name: Build, test and deploy

# One workflow for the whole gate: lint, test, build, push, deploy.
#
# This used to be two files. `deploy.yml` fired only on shipping paths, so a
# test-only commit ran nothing at all and the suite could stay broken with no
# signal; `quality.yml` was added to cover that gap. Two files describing one
# pipeline is two chances to disagree, so they are merged here.
#
# The shipping-path filter did not disappear with the merge -- it moved into the
# `changes` job, which decides whether the build and deploy jobs run. Every
# push and pull request still gets linted and tested.

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

# Pushes queue instead of cancelling: a cancelled run could interrupt
# `deploy-vds` halfway and leave the container on a stale image. Pull request
# runs have no side effects, so they cancel freely.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install --no-cache-dir uv

      - name: Cache uv packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Ruff lint
        run: uv run ruff check --output-format=concise

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Run tests
        run: uv run pytest -v --tb=short -m "not integration"

  # Decides whether this run ships. The old `on.push.paths` filter lived at the
  # workflow level, where a non-matching push ran no jobs at all; here it only
  # gates the build and deploy jobs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      shipping: ${{ steps.diff.outputs.shipping }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect shipping-path changes
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Pull requests never build or deploy, so the answer is moot there.
          if [ "$EVENT" = "pull_request" ]; then
            echo "shipping=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A manual dispatch is an explicit request to ship.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "shipping=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A new branch or a force-push leaves no reliable parent commit. Fail
          # toward deploying: a redundant rebuild is cheap, a skipped one is a
          # silent stale production.
          case "$BEFORE" in
            ""|0000000000000000000000000000000000000000)
              echo "shipping=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          changed=$(git diff --name-only "$BEFORE" "$SHA")
          echo "changed files:"
          printf '%s\n' "$changed"

          if printf '%s\n' "$changed" | grep -qE '^(src/|Dockerfile|docker-compose\.ya?ml|pyproject\.toml|uv\.lock|\.github/workflows/deploy\.yml)'; then
            echo "shipping=true" >> "$GITHUB_OUTPUT"
          else
            echo "shipping=false" >> "$GITHUB_OUTPUT"
          fi

  test-build-push-ghcr:
    needs: [lint-and-test, changes]
    if: github.event_name != 'pull_request' && needs.changes.outputs.shipping == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      # No Python setup or `uv sync` here: the suite already ran in
      # `lint-and-test`, and this job only drives Docker.

      - id: img
        run: |
          owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "image_repo=ghcr.io/${owner_lc}/fast-mcp-telegram" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: sha
        run: echo "short=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.image_repo }}:main
            ${{ steps.img.outputs.image_repo }}:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vds:
    needs: test-build-push-ghcr
    runs-on: ubuntu-latest
    env:
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 15m
          envs: GHCR_PULL_TOKEN,GHCR_PULL_USER
          script: |
            set -euo pipefail
            cd /root/services/fast-mcp-telegram
            if [ -n "${GHCR_PULL_TOKEN:-}" ] && [ -n "${GHCR_PULL_USER:-}" ]; then
              echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_PULL_USER" --password-stdin
            fi
            docker compose pull && docker compose up -d
